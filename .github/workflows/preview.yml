name: preview

# Vercel previews for pull requests, dev, and manual UI reviews.
#
# Production stays on the Vercel Git integration (pushes to main deploy as
# before). This workflow deploys previews with the team token from repo
# secrets, and it strips .git before deploying so the
# deployment carries no git author for Vercel to reject.
#
# Requires three repository secrets (owner sets them once):
#   VERCEL_TOKEN       - vercel.com/account/tokens
#   VERCEL_ORG_ID      - .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  - same file

on:
  pull_request:
  push:
    branches: [dev]
  # Two things need a manual preview. The refresh bot's data commit is made
  # with GITHUB_TOKEN, which does not trigger a workflow, so after it lands on
  # dev the preview still serves the previous data.json until somebody pushes.
  # And a branch with no pull request open -- the UI work -- has no other way
  # to be looked at. A manual dev run updates the stable dev alias too.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Two pushes to dev seconds apart ran two deploys, and the one that finished
# second was not the newer commit: it set `social-sim-arena-dev.vercel.app` to
# the older deployment, so the alias served a build nobody had asked for. One
# run per ref at a time, and a superseded one is cancelled rather than allowed
# to win the alias.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs get no secrets by design; forecast submissions from entrants
    # only need validate.yml.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/ui/site-refinement'))
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: deploy a preview without git metadata
        id: deploy
        run: |
          rm -rf .git .vercel
          npm i -g vercel@latest
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: publish the preview link in the run summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: stable alias for the dev branch
        if: >-
          github.ref == 'refs/heads/dev' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          vercel alias set ${{ steps.deploy.outputs.url }} social-sim-arena-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
          echo "dev preview: https://social-sim-arena-dev.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      - name: comment the preview url
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nPreview: ${url}`;
            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number});
            const prev = comments.find(c => c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({...context.repo, comment_id: prev.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            }
