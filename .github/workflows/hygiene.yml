name: hygiene

# The arena repo carries the instrument, not the paper. Planning text for any
# manuscript (venues, deadlines, review phases) lives in the paper's own
# private repository; this check keeps it from ever landing here again.

on:
  pull_request:
  push:
    # dev as well as main. A commit pushed straight to dev was scanned by
    # nothing: this ran on pull requests and on pushes to main, and a direct
    # push to dev is neither. That is how the one commit message this check
    # objects to today reached the tree in the first place.
    branches: [main, dev]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: no paper-planning text in the tree
        run: |
          set -e
          pats='ICLR 2027|ICLR 2028|NeurIPS 2026|NeurIPS 2027|camera-ready|rebuttal|submission deadline|abstract deadline|reviews open'
          # The archive directories below are excluded, and the pattern is
          # untouched. They hold verbatim third-party bytes -- Tavily result
          # bodies, news digests, raw provider replies, fetched source pages --
          # recorded as evidence and never edited. A news article about
          # self-driving cars used one of these words in its ordinary English
          # sense, inside a search result a model fetched for a trends round,
          # and turned this check red on a tree with no planning text in it.
          # That file cannot be corrected without corrupting the evidence, and
          # the pattern cannot be narrowed without weakening the check
          # everywhere it matters.
          #
          # Everything we write is still scanned at full strength: docs, site,
          # ssa, tools, tests, questions, schema, handbook, examples,
          # templates, .github, and every top-level file. One directory per
          # line on purpose -- a broad glob would let our own prose escape the
          # check by living next to evidence.
          hits=$(grep -rInE "$pats" \
            --exclude-dir=.git --exclude=hygiene.yml \
            --exclude-dir=search --exclude-dir=news --exclude-dir=replies \
            --exclude-dir=sources --exclude-dir=civiqs --exclude-dir=trends \
            --exclude-dir=wikitop --exclude-dir=cache \
            . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo "planning text for the paper belongs in the paper repo, not here"
            exit 1
          fi

      # "New" means new to the repository, and this now says so.
      #
      # It runs on every push to main and dev, where a commit genuinely
      # arrives, and on every pull request -- but a pull request scans only the
      # commits that are not already on dev. That one exclusion is the whole
      # change, and it is a statement about what "new" means rather than about
      # which branch is which:
      #
      #   - a feature pull request (into dev, or straight into main as several
      #     older ones did) carries commits that are on no long-lived branch
      #     yet, so nothing is excluded and everything is scanned;
      #   - a release merge carries the whole backlog since the last release,
      #     every commit of which was scanned when it landed on dev. Scanned
      #     there and again here, one objection makes every future release
      #     merge red forever, and a check that is always red is a check nobody
      #     reads.
      #
      # That is not hypothetical: `e2efe649` renamed some wording *to comply
      # with this guard* and quoted the banned phrase in its message to explain
      # why. Branch names cannot tell these cases apart -- this release merge
      # comes from `merge-dev-...` rather than from `dev`, because the archive
      # collisions had to be resolved somewhere -- but reachability can.
      #
      # Coverage goes up. Before this, a direct push to dev was scanned by
      # nothing at all: the workflow ran on pull requests and on pushes to
      # main, and a push to dev is neither. That is how the objectionable
      # message got in.
      - name: no venue talk in new commit messages
        run: |
          set -e
          git fetch -q --no-tags origin dev main || true
          pats='ICLR|NeurIPS|camera-ready|rebuttal|submission deadline'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            # Anything already on dev was scanned when it landed there.
            if git rev-parse --verify -q refs/remotes/origin/dev >/dev/null; then
              range="$range ^refs/remotes/origin/dev"
            fi
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # A new branch has no "before"; scan its tip alone rather than
            # every commit that has ever existed.
            range="-1 HEAD"
          else
            # A push: exactly the commits it introduced. No dev exclusion here
            # -- on a push to dev they are on dev by definition, and excluding
            # them would scan nothing at all.
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "scanning $range"
          if git log --format=%B $range | grep -inE "$pats"; then
            echo "venue talk in a commit message; keep it in the paper repo"
            exit 1
          fi

      - name: mock stays impossible in CI
        run: |
          if [ -n "${SSA_ALLOW_MOCK:-}" ]; then
            echo "SSA_ALLOW_MOCK is set in the CI environment"
            exit 1
          fi
          if grep -rn "SSA_ALLOW_MOCK" .github/workflows --include='*.yml' | grep -v hygiene.yml | grep -q .; then
            echo "a workflow sets SSA_ALLOW_MOCK; live data must never be mocked"
            exit 1
          fi
