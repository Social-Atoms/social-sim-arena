name: hygiene

# The arena repo carries the instrument, not the paper. Planning text for any
# manuscript (venues, deadlines, review phases) lives in the paper's own
# private repository; this check keeps it from ever landing here again.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: no paper-planning text in the tree
        run: |
          set -e
          pats='ICLR 2027|ICLR 2028|NeurIPS 2026|NeurIPS 2027|camera-ready|rebuttal|submission deadline|abstract deadline|reviews open'
          # The archive directories below are excluded, and the pattern is
          # untouched. They hold verbatim third-party bytes -- Tavily result
          # bodies, news digests, raw provider replies, fetched source pages --
          # recorded as evidence and never edited. A news article about
          # self-driving cars used one of these words in its ordinary English
          # sense, inside a search result a model fetched for a trends round,
          # and turned this check red on a tree with no planning text in it.
          # That file cannot be corrected without corrupting the evidence, and
          # the pattern cannot be narrowed without weakening the check
          # everywhere it matters.
          #
          # Everything we write is still scanned at full strength: docs, site,
          # ssa, tools, tests, questions, schema, handbook, examples,
          # templates, .github, and every top-level file. One directory per
          # line on purpose -- a broad glob would let our own prose escape the
          # check by living next to evidence.
          hits=$(grep -rInE "$pats" \
            --exclude-dir=.git --exclude=hygiene.yml \
            --exclude-dir=search --exclude-dir=news --exclude-dir=replies \
            --exclude-dir=sources --exclude-dir=civiqs --exclude-dir=trends \
            --exclude-dir=wikitop --exclude-dir=cache \
            . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo "planning text for the paper belongs in the paper repo, not here"
            exit 1
          fi

      - name: no venue talk in new commit messages
        if: github.event_name == 'pull_request'
        run: |
          pats='ICLR|NeurIPS|camera-ready|rebuttal|submission deadline'
          if git log --format=%B origin/${{ github.base_ref }}..HEAD | grep -inE "$pats"; then
            echo "venue talk in a commit message; keep it in the paper repo"
            exit 1
          fi

      - name: mock stays impossible in CI
        run: |
          if [ -n "${SSA_ALLOW_MOCK:-}" ]; then
            echo "SSA_ALLOW_MOCK is set in the CI environment"
            exit 1
          fi
          if grep -rn "SSA_ALLOW_MOCK" .github/workflows --include='*.yml' | grep -v hygiene.yml | grep -q .; then
            echo "a workflow sets SSA_ALLOW_MOCK; live data must never be mocked"
            exit 1
          fi
