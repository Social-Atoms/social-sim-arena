name: questions

# The generation and publication path, checked on every PR that touches it.
#
# These gates are the whole reason a generated round is safe to review: a
# source whose rights are unresolved generates nothing, a series too short to
# baseline generates nothing, a series whose every movement is measurement
# noise generates nothing, a schedule that cannot be inferred generates
# nothing, and a round whose batch deadline has passed generates nothing. Each
# one is a test, and none of them ran anywhere before this file existed --
# `validate.yml` only looks at submitted forecasts.
#
# Everything here is offline. No key, no provider, no upstream fetch: the
# generator reads committed archives and the bundle reads the season file, so
# a source being down cannot fail this job and this job cannot spend money.

on:
  pull_request:
    paths:
      - ".github/workflows/questions.yml"
      - ".github/workflows/refresh.yml"
      - "questions/**"
      - "examples/bundle/**"
      - "templates/**"
      - "docs/weekly-pipeline.md"
      - "docs/bundle-submission.md"
      - "schema/**"
      - "sources/marts/**"
      - "ssa/**"
      - "tools/**"
      - "tests/**"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/questions.yml"
      - ".github/workflows/refresh.yml"
      - "questions/**"
      - "examples/bundle/**"
      - "templates/**"
      - "docs/weekly-pipeline.md"
      - "docs/bundle-submission.md"
      - "schema/**"
      - "ssa/**"
      - "tools/**"
      - "tests/**"

jobs:
  questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Every suite, discovered -- never a hand-written list. The list this
      # replaced ran 14 of 51 suites, and the 37 it skipped included
      # `test_scoring.py`. Two of the skipped suites were red on dev for days
      # while this workflow reported success, which is worse than having no
      # workflow: a green tick that does not mean the tests pass teaches
      # everyone to stop reading it. A new suite is covered the moment it is
      # committed, with nothing to remember.
      #
      # `tests/test_harness.py` and `tests/test_model_backtest.py` are
      # gitignored at the maintainer's request, so they are not here to
      # discover. That is intended, not a gap this should paper over.
      - name: every test suite in the repository
        run: |
          set -uo pipefail
          failed=""
          count=0
          for t in tests/test_*.py; do
            count=$((count + 1))
            if PYTHONPATH=. python "$t" > /tmp/suite.log 2>&1; then
              echo "ok   $t"
            else
              echo "FAIL $t"
              tail -25 /tmp/suite.log | sed 's/^/       /'
              failed="$failed $t"
            fi
          done
          echo
          echo "$count suites discovered"
          if [ -n "$failed" ]; then
            echo "failing suites:$failed"
            exit 1
          fi
          # A glob that silently matches nothing would report success having
          # run no tests at all, which is the failure this whole step exists
          # to stop. The floor is well under the current count so it does not
          # need editing every time a suite is added or retired.
          if [ "$count" -lt 40 ]; then
            echo "only $count suites discovered; the glob is not seeing tests/"
            exit 1
          fi

      - name: the reviewed season is semantically publishable
        run: PYTHONPATH=. python tools/validate_season.py

      - name: every committed bundle still matches its schema
        run: |
          PYTHONPATH=. python - <<'PY'
          import glob, json, jsonschema
          schema = json.load(open("schema/bundle.schema.json"))
          paths = sorted(glob.glob("questions/bundles/*.json"))
          for p in paths:
              jsonschema.validate(json.load(open(p)), schema)
              print(f"ok {p}")
          print(f"{len(paths)} bundles validated")
          PY
