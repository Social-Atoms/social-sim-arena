name: reveal-signed-forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  reveal:
    if: vars.SSA_SIGNED_REVEAL_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch fixed encrypted snapshot
        run: git fetch origin sealed:refs/remotes/origin/sealed
      - name: Reveal completed rounds
        env:
          SSA_AGE_IDENTITIES: ${{ secrets.SSA_AGE_IDENTITIES }}
        run: python tools/reveal_signed_forecasts.py --snapshot refs/remotes/origin/sealed
      - name: Audit and publish
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add forecasts
          if test -d reveal-receipts; then git add reveal-receipts; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reveal signed forecasts after their deadlines'
          git fetch origin sealed:refs/remotes/origin/sealed
          git pull --rebase origin main
          python tools/audit_landing.py HEAD^ HEAD
          git push origin HEAD:main
