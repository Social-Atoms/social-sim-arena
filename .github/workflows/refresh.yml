name: refresh-data
# The arena's always-on agents. Every 6 hours this fetches the live series,
# recomputes the baselines from strictly pre-lock history, asks each frontier
# model for a forecast on every open round, and commits the result. The last
# commit before a round's lock_at is the one that counts, so the cadence only
# has to be comfortably faster than the 48-hour lock window -- GitHub's cron
# is best-effort and can drift 5-20 minutes, which this tolerates by design.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data        # never let two runs race on the same commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Model entrants run only for the providers whose key is set; the rest
      # file clearly-labeled MOCK forecasts. Add keys under
      # Settings > Secrets and variables > Actions.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # Optional per-entrant endpoint and model overrides, for self-hosted
      # gateways and regional deployments that speak the same protocol on a
      # different host. Set either a repository *variable* (plain config) or a
      # *secret* (when the hostname itself is internal); unset leaves the
      # default in ssa/harness.py. The base is part of both cache keys, so
      # switching gateways correctly re-runs instead of reusing stale replies.
      SSA_BASE_QWEN: ${{ vars.SSA_BASE_QWEN || secrets.SSA_BASE_QWEN }}
      SSA_BASE_DEEPSEEK: ${{ vars.SSA_BASE_DEEPSEEK || secrets.SSA_BASE_DEEPSEEK }}
      SSA_BASE_GPT_5_5: ${{ vars.SSA_BASE_GPT_5_5 || secrets.SSA_BASE_GPT_5_5 }}
      SSA_BASE_CLAUDE_OPUS: ${{ vars.SSA_BASE_CLAUDE_OPUS || secrets.SSA_BASE_CLAUDE_OPUS }}
      SSA_BASE_GEMINI_PRO: ${{ vars.SSA_BASE_GEMINI_PRO || secrets.SSA_BASE_GEMINI_PRO }}
      SSA_BASE_GROK: ${{ vars.SSA_BASE_GROK || secrets.SSA_BASE_GROK }}
      SSA_MODEL_QWEN: ${{ vars.SSA_MODEL_QWEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m tests.test_scoring
      - run: python -m ssa.refresh
      - name: commit if changed
        run: |
          git config user.name "ssa-bot"
          git config user.email "actions@github.com"
          git add -A forecasts site/data.json
          # ignore the generated_at stamp so no-op runs do not commit
          if git diff --cached --quiet -I '"generated_at"'; then
            echo "no substantive change"
            git reset --quiet
            git checkout -- site/data.json forecasts
          else
            git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
