name: refresh-data
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m tests.test_scoring
      - run: python -m ssa.refresh
      - name: commit if changed
        run: |
          git config user.name "ssa-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet site/data.json; then
            git add site/data.json
            git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
