name: refresh-data
# The arena's always-on agents. Every 6 hours this fetches the live series,
# recomputes the baselines from strictly pre-lock history, asks each frontier
# model for a forecast on every open round, and commits the result. The last
# commit before a round's lock_at is the one that counts, so the cadence only
# has to be comfortably faster than the 48-hour lock window -- GitHub's cron
# is best-effort and can drift 5-20 minutes, which this tolerates by design.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data        # never let two runs race on the same commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Model entrants run only for the providers whose key is set; the rest
      # file clearly-labeled MOCK forecasts. Add keys under
      # Settings > Secrets and variables > Actions.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # Optional per-entrant endpoint and model overrides, for self-hosted
      # gateways and regional deployments that speak the same protocol on a
      # different host. Set either a repository *variable* (plain config) or a
      # *secret* (when the hostname itself is internal); unset leaves the
      # default in ssa/harness.py. The base is part of both cache keys, so
      # switching gateways correctly re-runs instead of reusing stale replies.
      # Qwen, Kimi, GLM and MiniMax are one deployment behind one gateway, so
      # they share one variable rather than four that can drift apart. The
      # existing SSA_BASE_QWEN secret is accepted as a fallback.
      SSA_BASE_GATEWAY: ${{ vars.SSA_BASE_GATEWAY || secrets.SSA_BASE_GATEWAY || secrets.SSA_BASE_QWEN }}
      SSA_BASE_QWEN: ${{ vars.SSA_BASE_QWEN || secrets.SSA_BASE_QWEN }}
      # One key and one OpenAI-compatible endpoint in front of every vendor, as
      # a standby for the failure a code change cannot fix: on 2026-08-14 the
      # Anthropic organisation was disabled and the OpenAI account ran out of
      # credits, which is seven of fifteen entrants dead on every refresh while
      # the locks kept arriving on schedule.
      #
      # SSA_OPENROUTER is the switch and it is off unless set: a comma-separated
      # list of model keys, or `1` for all of them. Nothing here fails over on
      # its own, because the endpoint is part of the condition -- two hosts can
      # serve different weights under one model name and reach a different
      # reasoning depth, and an automatic switch on a transient 429 would move
      # an entrant mid-season with nothing on the leaderboard saying so. Every
      # forecast records which route produced it (`via=` in its notes).
      # The one search index every `web` entrant uses. Free tier, no card, and
      # the arm is off unless SSA_ELICITATION names `web` -- so merging the
      # code never starts spending. Every query and result is committed under
      # search/, which is simultaneously the cost control (overlapping
      # keywords cost one request across all fifteen models), the audit trail,
      # and the only reason a web forecast can be re-derived: search results
      # change by the minute and this arm cannot be backtested.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPEN_ROUTER: ${{ secrets.OPEN_ROUTER }}
      SSA_OPENROUTER: ${{ vars.SSA_OPENROUTER }}
      # Which elicitation arms file forecasts, as a comma-separated list
      # (`news`, `superfc`, `persona`, or `1` for all). Unset means none, so
      # merging the code for an arm never starts paying for it -- switching one
      # on is setting a repository variable, and tools/estimate_arms.py prints
      # the season's bill for each before anyone does. The arms differ by two
      # orders of magnitude: news is about $8 a season, persona about $39.
      SSA_ELICITATION: ${{ vars.SSA_ELICITATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # The timestamp client, not a library the code imports: ssa/stamps.py
      # shells out to `ots` and degrades to "manifest written, unstamped" when
      # it is absent, so a failure here is visible rather than fatal. Free, no
      # key, four public calendars.
      - run: pip install opentimestamps-client
      - run: python -m tests.test_scoring
      # Keyless and instant, and it runs here rather than only on a PR because
      # the thing it guards is this job's configuration: SSA_OPENROUTER is set
      # in repository variables, so a typo in it never passes through a review.
      - run: python tests/test_routes.py
        env:
          PYTHONPATH: .
      - run: python -m ssa.refresh
      # Resolution runs after the refresh so it scores against the series the
      # same run just fetched. It only ever adds, never overwrites, and
      # refuses anything ambiguous with a reason in the log -- so a bad
      # afternoon leaves rounds unresolved rather than mis-scored.
      #
      # always(), for the same reason the steps below carry it: ssa.refresh
      # exits non-zero when any one entrant's provider call fails, and without
      # this a single timed-out forecast skips resolution for the whole run.
      # Harmless while every round is still open, and not harmless from the
      # first release onward -- that is precisely the day a run is most likely
      # to be busy enough to time out, and the leaderboard would stay empty
      # with nothing in the log saying why. Resolution does not depend on the
      # forecasts anyway: it reads the series and the frozen lock snapshots.
      - run: python -m ssa.resolve --write
        if: always()
      # data.json is rebuilt so the leaderboard reflects anything just
      # resolved, instead of waiting six hours for the next run.
      - run: python -m ssa.refresh
        if: always()
      # always(): ssa.refresh exits non-zero when any entrant's provider call
      # fails, but the forecasts that did succeed are already written and a
      # round locks on a hard deadline. Commit what landed, and let the job
      # still report failure so the cause gets fixed.
      - name: commit if changed
        if: always()
        run: |
          git config user.name "ssa-bot"
          git config user.email "actions@github.com"
          # `site`, not `site/data.json`: ssa.refresh also rewrites
          # site/card.png, and leaving a tracked file modified but unstaged
          # makes `git pull --rebase` refuse to run. Every scheduled run since
          # the merge committed its forecasts locally and then died there,
          # throwing the work away while the API calls had already been paid
          # for. autoStash is the belt to that braces.
          # Four directories beyond the obvious ones, each holding something
          # that cannot be reconstructed after the fact:
          #   civiqs   Civiqs publishes only its current reading, so the daily
          #            snapshot is the only record that a day ever said what it
          #            said, and it is the backfill base for every earlier day.
          #   news     the exact corpus every entrant in a round was given.
          #   sources  the upstream bodies as they arrived, hashed and dated.
          #            Twenty-one series come through one sheet that is revised
          #            in place; without a vintage a resolution cannot be
          #            rechecked.
          #   stamps   the per-round manifest and its OpenTimestamps proof. A
          #            proof left on the runner proves nothing to anyone.
          #   search   every query a web entrant issued and every result it got
          #            back. Unlike news, this corpus did not exist until a
          #            model asked for it, and the index will not return the
          #            same thing tomorrow.
          git add -A forecasts site resolutions locks civiqs news stamps sources search
          # ignore the generated_at stamp so no-op runs do not commit
          if git diff --cached --quiet -I '"generated_at"'; then
            echo "no substantive change"
            git reset --quiet
            git checkout -- site forecasts resolutions locks civiqs news stamps sources search
          else
            git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git -c rebase.autoStash=true pull --rebase origin main
            git push
          fi
