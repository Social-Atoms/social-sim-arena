name: validate-submissions
on:
  pull_request:
    paths:
      - "forecasts/**"
      - "entrants/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: validate changed forecast and entrant files
        run: |
          FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- 'forecasts/**/*.json' 'entrants/*.json')
          if [ -z "$FILES" ]; then echo "no forecast or entrant files changed"; exit 0; fi
          echo "$FILES"
          # --author/--base: the file's `github` owner must be the pull
          # request's author (or a maintainer); see tools/validate_submission.py
          python tools/validate_submission.py \
            --author "${{ github.event.pull_request.user.login }}" \
            --base "origin/${{ github.base_ref }}" $FILES
