name: validate-submissions
on:
  pull_request:
    paths:
      - "forecasts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: validate changed forecast files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'forecasts/**/*.json')
          if [ -z "$FILES" ]; then echo "no forecast files changed"; exit 0; fi
          echo "$FILES"
          python tools/validate_submission.py $FILES
