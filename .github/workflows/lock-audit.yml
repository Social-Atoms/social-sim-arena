name: lock-audit
# PR validation runs when a pull request is opened, which can be before the
# deadline. This audit re-runs validation at LANDING time: if a forecast merges
# to main after its batch deadline, this check turns red on the merge commit.
#
# A push made by refresh.yml with the repository GITHUB_TOKEN intentionally
# does not trigger another workflow (GitHub's recursion guard). refresh.yml
# therefore calls tools/audit_landing.py itself after rebasing and before its
# bot commit is pushed. Human/third-party pushes arrive here. Both roads execute
# the same validator over the same HEAD^..HEAD range.
on:
  push:
    branches: [main]
    paths:
      - "forecasts/**"
      - "entrants/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: re-validate files changed by this push
        run: python tools/audit_landing.py HEAD^ HEAD
