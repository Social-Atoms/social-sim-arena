<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="lip"><path d="M163 222 A93 57 0 0 0 349 222 L349 40 L163 40 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#efece4"/>
  <!-- latitude front arcs, tangent to the limb (25 deg tilt), lower hemisphere only -->
  <g fill="none" stroke="#1a1a18" stroke-width="1.8" opacity="0.5" stroke-dasharray="9 8" stroke-linecap="round">
    <path d="M106 256 A150 63.4 0 0 0 406 256"/>
    <path d="M117.09 312.61 A140.95 59.57 0 0 0 394.91 312.61"/>
    <path d="M150.25 362.39 A114.91 48.56 0 0 0 361.75 362.39"/>
    <path d="M211.8 399.33 A75 31.7 0 0 0 300.2 399.33"/>
  </g>
  <!-- sphere silhouette -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1a1a18" stroke-width="4.8"/>
  <!-- opening knockout -->
  <ellipse cx="256" cy="222" rx="93" ry="57" fill="#efece4"/>
  <!-- far rim, behind the atoms -->
  <path d="M163 222 A93 57 0 0 1 349 222" fill="none" stroke="#1a1a18" stroke-width="3.2"/>
  <!-- atoms nested in the cavity, clipped at the near lip -->
  <g clip-path="url(#lip)" fill="#efece4" stroke="#1a1a18" stroke-width="3.2">
    <circle cx="256" cy="200" r="44"/>
    <circle cx="225" cy="250" r="44"/>
    <circle cx="287" cy="250" r="44"/>
  </g>
  <!-- near lip with wall thickness, in front of the atoms -->
  <path d="M175 219 A81 48 0 0 0 337 219" fill="none" stroke="#1a1a18" stroke-width="1.8"/>
  <path d="M163 222 A93 57 0 0 0 349 222" fill="none" stroke="#1a1a18" stroke-width="4.8"/>
</svg>
